# exp_id.yml — 에이전트(AI팀)가 생성하는 실험 설계 명세 + 최종 점수 (백엔드는 읽기 전용)
exp_id_yml:
  hypothesis_id: string         # 부모 가설 ID
  exp_id: string                # 해당 실험 고유 ID
  design:
    experiment_text: string     # 가설 기반 실험 설계 요약 (예: "모델을 XGBoost로 변경하여 실험 진행")
    model: string               # 구체적인 모델명 (예: "XGBoost")
    features: list              # 사용할 피처 목록
    hyperparameters: object     # 하이퍼파라미터 키-값
    formula: string             # 평가 산식/수식
  score: float | null           # 실험 점수 (초기 null, 에이전트가 최종 채움)

# status.yml — 백엔드가 골격(status=ready) 생성, 에이전트가 진행 상태를 트래킹 (UI 표시용)
status_yml:
  hypothesis_id: string         # 부모 가설 ID
  exp_id: string                # 해당 실험 고유 ID
  current_task: string | null   # 현재 진행 중인 작업 (예: "EDA 진행 중", "피처 엔지니어링 진행 중")
  status: string                # 해당 실험의 상태 (ready / running / done / failed)
  last_updated: string          # 상태가 마지막으로 변경된 시각 (ISO 8601)
  analysis_text: string | null  # 작업 관련 로그/분석 코멘트 (선택적 사용)
