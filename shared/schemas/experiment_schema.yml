# exp_id.yml — 에이전트(AI팀)가 생성하는 실험 설계 명세 스키마 (백엔드는 읽기 전용)
exp_id_yml:
  hypothesis_id: string
  exp_id: string
  design:
    features: list           # 사용할 피처 목록
    hyperparameters: object  # 하이퍼파라미터 키-값
    model: string            # 모델명
    formula: string          # 평가 산식/수식

# status.yml — 백엔드가 골격(status=ready) 생성, 에이전트가 진행 중 갱신
status_yml:
  hypothesis_id: string
  exp_id: string
  status: string             # ready / running / done / failed
  score: float | null        # 실험 점수 (초기 null, 에이전트가 채움)
  analysis_text: string | null  # 실험 결과 분석 텍스트 (에이전트가 채움)
  updated_at: string         # ISO 8601 타임스탬프
